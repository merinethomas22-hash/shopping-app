version: '3.8'
services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3005:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5005/api
    depends_on:
      - backend
  backend:
    build:
      context: ./backend
    ports:
      - "5005:5000"
    environment:
      - PORT=5000
      - DB_HOST=myproject-db.ct4ywws6a5v2.ap-south-1.rds.amazonaws.com
      - DB_USER=admin
      - DB_PASS=Admin@12345
      - DB_NAME=myappdb
      - JWT_SECRET=supersecretkey_dev
    volumes:
      - backend_uploads:/usr/src/app/uploads
volumes:
  backend_uploads:
