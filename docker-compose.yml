version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3005:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5005/api
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "5005:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=babyshop
      - JWT_SECRET=supersecretkey_dev
    depends_on:
      - db
    volumes:
      - backend_uploads:/usr/src/app/uploads

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: babyshop
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  backend_uploads:
