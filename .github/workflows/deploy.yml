name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via Bastion
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.BASTION_HOST }}
          username: ubuntu
          key: ${{ secrets.BASTION_KEY }}
          proxy_host: ""
          script: |
            ssh -o StrictHostKeyChecking=no -i ~/app-key.pem ubuntu@10.0.3.245 << 'ENDSSH'
            cd /home/ubuntu/shopping-app
            git pull
            sudo docker compose up -d --build
            ENDSSH
